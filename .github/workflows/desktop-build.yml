name: Desktop build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Tag runs are never cancelled.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  FLUTTER_VERSION: '3.41.6'

jobs:
  version:
    name: Version
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="$GITHUB_REF_NAME"
            if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::Tag '$tag' must be vX.Y.Z or vX.Y.Z-suffix" >&2
              exit 1
            fi
            version="${tag#v}"
          else
            version=$(sed -n 's/^version: *\([^+ ]*\).*/\1/p' pubspec.yaml)
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  check:
    name: Analyze and test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

  windows:
    name: Windows x64
    needs: [version, check]
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - run: flutter pub get

      - name: Build
        shell: bash
        run: |
          defines=()
          if [[ "$FORK_PR" != "true" ]]; then
            if [[ -z "$SUPABASE_URL" || -z "$SUPABASE_ANON_KEY" ]]; then
              echo "::error::SUPABASE_URL and SUPABASE_ANON_KEY secrets are required" >&2
              exit 1
            fi
            defines=(--dart-define="SUPABASE_URL=$SUPABASE_URL" --dart-define="SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY")
          fi
          flutter build windows --release \
            --build-name="$VERSION" --build-number="$GITHUB_RUN_NUMBER" \
            "${defines[@]}"

      - name: Package
        shell: pwsh
        run: |
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "OpenNotes-$env:VERSION-windows-x64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: packages-windows
          path: OpenNotes-*.zip
          if-no-files-found: error
          retention-days: 30

  macos:
    name: macOS universal
    needs: [version, check]
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install create-dmg
        run: brew install create-dmg

      - run: flutter pub get

      - name: Build
        shell: bash
        run: |
          defines=()
          if [[ "$FORK_PR" != "true" ]]; then
            if [[ -z "$SUPABASE_URL" || -z "$SUPABASE_ANON_KEY" ]]; then
              echo "::error::SUPABASE_URL and SUPABASE_ANON_KEY secrets are required" >&2
              exit 1
            fi
            defines=(--dart-define="SUPABASE_URL=$SUPABASE_URL" --dart-define="SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY")
          fi
          flutter build macos --release \
            --build-name="$VERSION" --build-number="$GITHUB_RUN_NUMBER" \
            "${defines[@]}"

      - name: Verify universal binary and ad-hoc signature
        shell: bash
        run: |
          app="build/macos/Build/Products/Release/open_notes.app"
          archs=$(lipo -archs "$app/Contents/MacOS/open_notes")
          if [[ "$archs" != *arm64* || "$archs" != *x86_64* ]]; then
            echo "::error::Expected universal binary, got: $archs" >&2
            exit 1
          fi
          codesign --force --deep --preserve-metadata=entitlements,requirements,flags --sign - "$app"

      - name: Package
        run: |
          mkdir -p dmg-staging
          cp -R build/macos/Build/Products/Release/open_notes.app dmg-staging/
          create-dmg \
            --volname "OpenNotes" \
            --window-size 600 400 \
            --icon-size 128 \
            --icon "open_notes.app" 150 190 \
            --app-drop-link 450 190 \
            "OpenNotes-$VERSION-macos-universal.dmg" \
            dmg-staging

      - uses: actions/upload-artifact@v4
        with:
          name: packages-macos
          path: OpenNotes-*.dmg
          if-no-files-found: error
          retention-days: 30

  linux:
    name: Linux x86_64
    needs: [version, check]
    runs-on: ubuntu-22.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
      FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake git ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - run: flutter pub get

      - name: Build
        shell: bash
        run: |
          defines=()
          if [[ "$FORK_PR" != "true" ]]; then
            if [[ -z "$SUPABASE_URL" || -z "$SUPABASE_ANON_KEY" ]]; then
              echo "::error::SUPABASE_URL and SUPABASE_ANON_KEY secrets are required" >&2
              exit 1
            fi
            defines=(--dart-define="SUPABASE_URL=$SUPABASE_URL" --dart-define="SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY")
          fi
          flutter build linux --release \
            --build-name="$VERSION" --build-number="$GITHUB_RUN_NUMBER" \
            "${defines[@]}"

      - name: Package AppImage
        shell: bash
        run: |
          bundle=build/linux/x64/release/bundle
          appdir=AppDir
          mkdir -p "$appdir/usr/bin"
          cp -R "$bundle/." "$appdir/usr/bin/"
          cp assets/icon/OpenNotes-square.png "$appdir/open_notes.png"
          cat > "$appdir/open_notes.desktop" <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=OpenNotes
          Exec=open_notes
          Icon=open_notes
          Categories=Office;
          MimeType=x-scheme-handler/opennotes;
          Terminal=false
          EOF
          cat > "$appdir/AppRun" <<'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/bin/open_notes" "$@"
          EOF
          chmod +x "$appdir/AppRun"
          curl -fsSL -o appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          ARCH=x86_64 APPIMAGE_EXTRACT_AND_RUN=1 ./appimagetool "$appdir" "OpenNotes-$VERSION-linux-x86_64.AppImage"

      - uses: actions/upload-artifact@v4
        with:
          name: packages-linux
          path: OpenNotes-*.AppImage
          if-no-files-found: error
          retention-days: 30

  release:
    name: GitHub Release
    needs: [windows, macos, linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: packages-*
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: OpenNotes-*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
